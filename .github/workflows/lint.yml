name: Lint

on:
  pull_request:
    branches: [ main ]  # main に向けた PR で発火
    types: [opened, synchronize, reopened]

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install safe-chain
        run: |
          curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/main/install-scripts/install-safe-chain.sh \
            | sh -s -- --ci --include-python

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint